[workspace]
resolver = "2"
members = ["newt-core", "newt-agent", "newt-ffi", "newt-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
newt-core = { path = "newt-core" }
newt-agent = { path = "newt-agent" }

# Pinned exactly: 0.x crate, API churns between patch releases.
alacritty_terminal = "=0.26.0"
portable-pty = "0.9"
vte = { version = "0.15", features = ["ansi"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
